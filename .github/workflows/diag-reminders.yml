name: Diagnose reminders (read-only)
on:
  push:
    branches: [diag/reminders]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          S=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SQL="select timestamp, event_message from function_logs where event_message like '%[Reminders]%' order by timestamp desc limit 40"
          curl -sS -G "https://api.supabase.com/v1/projects/pfeneycysyczdljnuhov/analytics/endpoints/logs.all" -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" | jq -r '.result[]? | "\(.timestamp) \(.event_message)"' | sed -E 's/appointment [0-9a-f-]{36}/appointment X/' | sort | uniq -c | tail -40
          echo "=== invocations"
          SQL2="select count(*) as n, max(timestamp) as last from function_edge_logs cross join unnest(metadata) m cross join unnest(m.request) r where r.path like '%send-appointment-reminders%'"
          curl -sS -G "https://api.supabase.com/v1/projects/pfeneycysyczdljnuhov/analytics/endpoints/logs.all" -H "Authorization: Bearer $TOKEN" --data-urlencode "sql=$SQL2" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E"
