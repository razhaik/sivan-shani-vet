# Deploys the Supabase Edge Functions whenever they change.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main, migrate-to-supabase]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pfeneycysyczdljnuhov
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
