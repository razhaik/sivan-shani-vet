name: Apply reminder schedule (one-time)
on:
  workflow_dispatch:
  push:
    branches: [migrate-to-supabase]
    paths: [supabase/migrations/20261116000003_reminder_schedule.sql]
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -Rs '{query: .}' supabase/migrations/20261116000003_reminder_schedule.sql > body.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/pfeneycysyczdljnuhov/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @body.json
          echo
          jq -n '{query: "select jobname, schedule, active from cron.job"}' > check.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/pfeneycysyczdljnuhov/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @check.json
