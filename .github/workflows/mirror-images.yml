name: Copy images off Buildy (one-time)
on:
  workflow_dispatch:
  push:
    branches: [migrate-to-supabase]
    paths: [scripts/mirror-buildy-images.py]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/mirror-buildy-images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A public/media src supabase index.html
          git diff --cached --quiet || git commit -m "Copy site images off Buildy storage"
          git push
